<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NAVDATA Downloads</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; color: #222; }
  h1 { font-size: 1.6rem; }
  ul { list-style: none; padding: 0; }
  li { margin: 1rem 0; }
  a.btn { display: inline-block; padding: .75rem 1.25rem; background: #0b5cad; color: #fff; text-decoration: none; border-radius: 6px; }
  a.btn:hover { background: #084a8c; }
  .size { color: #666; font-size: .9rem; margin-left: .5rem; }
  .date { display: block; color: #666; font-size: .9rem; margin-top: .25rem; }
</style>
</head>
<body>
  <h1>NAVDATA Downloads</h1>
  <ul>
    <li>
      <a class="btn" href="FILES/NAVDATA.EXE" download>NAVDATA.EXE</a><span class="size">~30 MB</span>
      <span class="date" data-path="FILES/NAVDATA.EXE">Uploaded: loading…</span>
    </li>
    <li>
      <a class="btn" href="FILES/obst.exe" download>obst.exe</a><span class="size">~12 MB</span>
      <span class="date" data-path="FILES/obst.exe">Uploaded: loading…</span>
    </li>
  </ul>

  <script>
    document.querySelectorAll('.date').forEach(function (el) {
      var url = 'https://api.github.com/repos/natehorst240-sketch/NAVDATA/commits?per_page=1&path='
                + encodeURIComponent(el.dataset.path);
      fetch(url)
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function (d) {
          var dt = new Date(d[0].commit.committer.date);
          el.textContent = 'Uploaded: ' + dt.toLocaleDateString('en-US',
            { year: 'numeric', month: 'short', day: 'numeric' });
        })
        .catch(function () { el.textContent = 'Uploaded: unavailable'; });
    });
  </script>
</body>
</html>
